{% set version = "4.10" %}

package:
  name: sed
  version: {{ version }}

source:
  url: http://ftp.gnu.org/gnu/sed/sed-{{ version }}.tar.xz
  sha256: b8e72182b2ec96a3574e2998c47b7aaa64cc20ce000d8e9ac313cc07cecf28c7

build:
  number: 0
  skip: true  # [win]

requirements:
  build:
    - gnuconfig  # [unix]
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - make
    - gettext-tools
  host:
    - libintl-devel      # [osx]

test:
  commands:
    - test -f "${PREFIX}/bin/sed"
    - sed --version

about:
  home: https://www.gnu.org/software/sed/
  license: GPL-3.0-only
  license_file: COPYING
  summary: sed (stream editor) is a non-interactive command-line text editor.

extra:
  recipe-maintainers:
    - tfors
    - hmaarrfk
    - xhochy
